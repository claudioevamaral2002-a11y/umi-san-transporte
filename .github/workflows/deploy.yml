name: Deploy

# Só roda depois do CI concluído com sucesso num push na main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: producao
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Banco antes do front: o front novo nunca chama RPC que ainda não existe.
      - name: Configuração do Auth, migrations e Edge Functions no Supabase
        env:
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_AUTH_CAPTCHA_SECRET: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GOOGLE_MAPS_CHAVE_SERVIDOR: ${{ secrets.GOOGLE_MAPS_CHAVE_SERVIDOR }}
        run: |
          set -euo pipefail
          # Guarda (a): o project_id de [remotes.producao] tem de ser o projeto de destino.
          PID=$(awk '/^\[remotes\.producao\]/{f=1;next} /^\[/{f=0} f && /^project_id/{gsub(/[" ]/,"",$0); sub(/^project_id=/,"",$0); print; exit}' supabase/config.toml)
          if [ -z "$PID" ] || [ "$PID" != "$REF" ]; then
            echo "project_id de [remotes.producao] difere de vars.SUPABASE_PROJECT_REF; abortando" >&2
            exit 1
          fi
          # Guarda (b): sem o segredo o captcha ficaria sem chave e travaria o login.
          : "${SUPABASE_AUTH_CAPTCHA_SECRET:?TURNSTILE_SECRET_KEY ausente no ambiente producao}"
          npx supabase link --project-ref "$REF"
          # O push envia o config.toml INTEIRO; o diff deixa registrado no log o que muda.
          npx supabase config diff --project-ref "$REF" || echo "config diff indisponível ou falhou (não bloqueia)"
          npx supabase config push --project-ref "$REF" --yes
          npx supabase db push --yes
          npx supabase secrets set APP_ORIGENS=https://umi-san-transporte.pages.dev --project-ref "$REF"
          # Fase 3A: chave de servidor do Google (Places New e Routes). Sem ela, a função `enderecos` devolve
          # MAPAS_INDISPONIVEL e o app cai no texto livre (RUNBOOK §Google Maps).
          if [ -n "${GOOGLE_MAPS_CHAVE_SERVIDOR:-}" ]; then
            printf 'GOOGLE_MAPS_CHAVE_SERVIDOR=%s\n' "$GOOGLE_MAPS_CHAVE_SERVIDOR" > "$RUNNER_TEMP/segredos-mapas.env"
            npx supabase secrets set --env-file "$RUNNER_TEMP/segredos-mapas.env" --project-ref "$REF"
            rm -f "$RUNNER_TEMP/segredos-mapas.env"
          else
            echo "GOOGLE_MAPS_CHAVE_SERVIDOR ausente: busca de endereços desligada (texto livre)"
          fi
          if [ -n "$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' 2>/dev/null)" ]; then
            npx supabase functions deploy --project-ref "$REF" --import-map supabase/functions/deno.json
          else
            echo "Nenhuma Edge Function para publicar"
          fi
      - name: Build
        run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "VITE_TURNSTILE_SITE_KEY ausente" >&2; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "VITE_SUPABASE_URL ausente" >&2; exit 1; }
          npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          # Fase 3A: chave de navegador, restrita ao domínio do app e só à Map Tiles API (pode faltar: sem mapa).
          # Aceita variável ou segredo do ambiente `producao` (ela vai no app de qualquer forma; a proteção é a restrição).
          VITE_GOOGLE_MAPS_CHAVE_NAVEGADOR: ${{ vars.VITE_GOOGLE_MAPS_CHAVE_NAVEGADOR || secrets.VITE_GOOGLE_MAPS_CHAVE_NAVEGADOR }}
      - name: Nenhum segredo no bundle
        run: node scripts/varrer-segredos.ts dist
      - name: Publicar no Cloudflare Pages
        run: |
          npx wrangler pages project create umi-san-transporte --production-branch main || echo "Projeto Pages já existe"
          npx wrangler pages deploy dist --project-name umi-san-transporte --branch main --commit-hash "${{ github.event.workflow_run.head_sha }}"
      - name: Verificar CSP publicada
        run: |
          set -euo pipefail
          sleep 20
          # Sem barra final: a CSP lista a origem, não o caminho.
          URL_SB="${VITE_SUPABASE_URL%/}"
          headers=$(curl -sfI https://umi-san-transporte.pages.dev)
          echo "$headers" | grep -i "content-security-policy" | grep -F "connect-src 'self' ${URL_SB}"
          echo "$headers" | grep -i "strict-transport-security"
