name: Criar primeiro ADM

# Manual, só pelo dono do repositório. O link de acesso aparece APENAS no resumo da execução.
on:
  workflow_dispatch:
    inputs:
      email:
        description: E-mail do primeiro administrador
        required: true
        type: string
      nome:
        description: Nome do primeiro administrador
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admin-producao
  cancel-in-progress: false

jobs:
  criar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: producao
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ENTRADA_EMAIL: ${{ inputs.email }}
      ENTRADA_NOME: ${{ inputs.nome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Gerar o convite (link só no resumo da execução)
        run: |
          set -euo pipefail
          : "${REF:?vars.SUPABASE_PROJECT_REF ausente no ambiente producao}"
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN ausente}"
          # A saída bruta nunca é impressa: vai direto para o node, que devolve só a chave.
          KEY=$(npx supabase projects api-keys --reveal --project-ref "$REF" -o json | node -e '
            let s = ""
            process.stdin.on("data", (d) => (s += d))
            process.stdin.on("end", () => {
              const lista = JSON.parse(s.slice(s.indexOf("[")))
              const k = lista.find((x) => x.name === "service_role") ?? lista.find((x) => x.type === "secret")
              if (!k || !k.api_key) process.exit(1)
              process.stdout.write(k.api_key)
            })')
          echo "::add-mask::$KEY"
          export SUPABASE_SERVICE_KEY="$KEY"
          export SUPABASE_URL="https://${REF}.supabase.co"
          export SITE_URL="https://umi-san-transporte.pages.dev"
          node scripts/criar-primeiro-adm.ts "$ENTRADA_EMAIL" "$ENTRADA_NOME"
