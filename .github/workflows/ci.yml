name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependências sem vulnerabilidade alta/crítica (especificação 9, item 13)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Segredos locais (testes públicos da Cloudflare, sempre aprovam)
        run: |
          mkdir -p supabase/functions
          echo "APP_ORIGENS=http://127.0.0.1:8788" > supabase/functions/.env
      - name: Supabase local
        env:
          SUPABASE_AUTH_CAPTCHA_SECRET: 1x0000000000000000000000000000000AA
        run: npx supabase start -x studio,imgproxy,vector,logflare
      - name: Edge Functions (serve com o .env; o start sozinho não carrega APP_ORIGENS)
        run: |
          eval "$(npx supabase status -o env | grep '^API_URL=')"
          echo "Antes do serve: POST sem token definir-senha -> $(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/functions/v1/definir-senha" || true)"
          nohup npx supabase functions serve --env-file supabase/functions/.env > functions-serve.log 2>&1 &
          codigo=000
          for i in $(seq 1 90); do
            grep -q "Serving" functions-serve.log || { sleep 1; continue; }
            codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/functions/v1/definir-senha" || true)
            if [ "$codigo" = "401" ]; then echo "Funções respondendo após ${i}s"; tail -n 5 functions-serve.log; exit 0; fi
            sleep 1
          done
          echo "Funções não responderam (último código: $codigo)"; cat functions-serve.log; exit 1
      - name: pgTAP
        run: npx supabase test db
      - run: node scripts/env-local.ts
      - run: npm run test:integracao
      - run: npm run build:test
      # Fase 4: o segundo site (ivo-novo), em dist-novo, servido pelo projeto Playwright `novo`.
      - run: npm run build:novo:test
      - name: Nenhum segredo no bundle (especificação 9, item 1)
        run: |
          node scripts/varrer-segredos.ts dist
          node scripts/varrer-segredos.ts dist-novo
      - run: node scripts/orcamento-bundle.ts
      - run: npx playwright install --with-deps chromium
      - name: E2E (mocks + fluxos reais contra o Supabase local)
        env:
          E2E_BACKEND_REAL: '1'
        run: npm run test:e2e
      # Por último (recria o banco): aplica as migrations novas sobre um estado igual ao de produção, como o
      # `db push` do deploy fará. Os testes acima partem de banco vazio e não exercitam a migração de dados.
      # Fase 4 (Ruling R18): para as migrations da fase 4 rodarem sobre um pedido de verdade, sobe primeiro só até a
      # fase 3B (as da fase 4 em diante, 2026102*, inclusive as da 4.1, saem da pasta), semeia um pedido orçado pelas RPCs
      # de hoje e então aplica o resto.
      - name: Migração sobre dados de produção (fases 1B, 2A, 2B e 4)
        run: |
          set -euo pipefail
          npx supabase db reset --version 20261008130900
          eval "$(npx supabase status -o env | grep '^DB_URL=')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f scripts/migracao-producao/antes.sql
          mkdir -p "$RUNNER_TEMP/fase4"
          mv supabase/migrations/2026102*.sql "$RUNNER_TEMP/fase4/"
          npx supabase migration up
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f scripts/migracao-producao/antes-fase4.sql
          mv "$RUNNER_TEMP/fase4/"*.sql supabase/migrations/
          npx supabase migration up
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/migracao-producao/depois.sql
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  segredos-repositorio:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
